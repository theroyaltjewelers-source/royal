<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<title>ROYAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Poppins:wght@300;400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="bar">
  <div class="mark" aria-label="ROYAL, The House of Royal T">
    <span class="word">ROYAL</span>
    <span class="house">THE HOUSE OF ROYAL T</span>
  </div>
  <nav class="realms" aria-label="Realm">
    <button type="button" data-realm="BUSINESS" aria-pressed="true">Business</button>
    <button type="button" data-realm="PERSONAL" aria-pressed="false">Personal</button>
  </nav>
  <div class="conn" id="conn" aria-live="polite"></div>
</header>

<section class="signin" id="signin" hidden>
  <h1>Sign in to ROYAL</h1>
  <p class="quiet">ROYAL uses the same account as the calculator. Only an owner can open it.</p>
  <form id="signinForm">
    <label for="signinEmail">Email</label>
    <input id="signinEmail" type="email" autocomplete="email" required>
    <button type="submit" class="primary">Send sign-in link</button>
  </form>
  <form id="codeForm" hidden>
    <label for="signinCode">Or enter the 6-digit code from the email</label>
    <input id="signinCode" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,10}" maxlength="10">
    <button type="submit" class="primary">Sign in with code</button>
  </form>
  <details class="dev" id="devBox" hidden>
    <summary>Development token</summary>
    <form id="devForm"><label for="devToken">Token</label><input id="devToken" type="password" autocomplete="off"><button type="submit">Use token</button></form>
  </details>
  <p class="quiet" id="signinStatus" role="status"></p>
</section>

<main id="main" hidden>
  <form class="command" id="command" role="search" aria-label="Ask ROYAL">
    <label for="ask" class="sr">Ask ROYAL anything</label>
    <input id="ask" type="text" autocomplete="off" placeholder="Ask ROYAL anything…" enterkeyhint="send" maxlength="2000">
    <button type="submit" class="primary" aria-label="Ask">Ask</button>
  </form>
  <div class="chips" id="chips" aria-label="Suggested commands"></div>
  <div class="working" id="working" aria-live="polite" hidden></div>

  <section class="answer" id="answer" aria-live="polite" hidden></section>

  <nav class="views" aria-label="Views">
    <button type="button" data-view="home" aria-pressed="true">Home</button>
    <button type="button" data-view="decisions" aria-pressed="false">Decisions <span class="count" id="decCount"></span></button>
    <button type="button" data-view="activity" aria-pressed="false">Activity</button>
    <button type="button" data-view="agents" aria-pressed="false">Agents</button>
    <button type="button" data-view="systems" aria-pressed="false">Systems</button>
  </nav>

  <section class="view" id="view-home"></section>
  <section class="view" id="view-decisions" hidden></section>
  <section class="view" id="view-activity" hidden></section>
  <section class="view" id="view-agents" hidden></section>
  <section class="view" id="view-systems" hidden></section>
</main>

<dialog id="modify" aria-labelledby="modifyTitle">
  <form method="dialog" id="modifyForm">
    <h2 id="modifyTitle">Modify before approving</h2>
    <label for="modifyBody">Message</label>
    <textarea id="modifyBody" rows="9"></textarea>
    <label for="modifyNote">Note (optional)</label>
    <input id="modifyNote" type="text">
    <div class="row"><button value="cancel" type="submit">Cancel</button><button value="ok" type="submit" class="primary">Approve with changes</button></div>
  </form>
</dialog>

<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
